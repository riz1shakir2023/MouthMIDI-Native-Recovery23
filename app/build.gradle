plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {

    namespace 'com.mouthmidi.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.mouthmidi.app"
        minSdk 26
        targetSdk 35
        // RULE (store model): Free and Pro of the same release share ONE
        // versionCode, bumped together. That is what lets Pro install over
        // Free as an in-place update, keeping the user's settings/presets.
        versionCode 3
        versionName "1.0.1"
    }

    flavorDimensions "tier"

    productFlavors {
        free {
            dimension "tier"
            manifestPlaceholders = [appLabel: "MouthMIDI"]
            versionNameSuffix "-free"
            buildConfigField "boolean", "IS_PRO", "false"
        }
        pro {
            dimension "tier"
            manifestPlaceholders = [appLabel: "MouthMIDI Pro"]
            versionNameSuffix "-pro"
            buildConfigField "boolean", "IS_PRO", "true"
        }
    }

    signingConfigs {
        release {
            // Values come from the environment (GitHub Secrets in CI).
            // Never hard-code passwords or commit a keystore.
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "mouthmidi-release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS") ?: "mouthmidi"
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
            // Sign only when CI supplied a keystore; local unsigned release
            // builds keep working exactly as before.
            if (System.getenv("KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation "androidx.camera:camera-core:1.4.1"
    implementation "androidx.camera:camera-camera2:1.4.1"
    implementation "androidx.camera:camera-lifecycle:1.4.1"
    implementation "androidx.camera:camera-view:1.4.1"

    implementation "com.google.mediapipe:tasks-vision:0.10.26.1"
}
