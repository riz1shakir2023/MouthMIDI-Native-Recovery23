name: Build Signed Release APKs

# Manual run from the Actions tab, or automatically on a version tag (v1.0, ...).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Decode the release keystore from secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 --decode --ignore-garbage > "${{ runner.temp }}/mouthmidi-release.jks"
          ls -la "${{ runner.temp }}/mouthmidi-release.jks"
          test $(stat -c%s "${{ runner.temp }}/mouthmidi-release.jks") -gt 2000
          keytool -list -keystore "${{ runner.temp }}/mouthmidi-release.jks" -storepass "$KEYSTORE_PASSWORD" | grep -i mouthmidi

      - name: Build Free + Pro release APKs (signed)
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/mouthmidi-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleFreeRelease assembleProRelease

      - name: Verify both APK signatures
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in app/build/outputs/apk/free/release/*.apk app/build/outputs/apk/pro/release/*.apk; do
            echo "== $apk =="
            "$APKSIGNER" verify --print-certs "$apk" | grep -i "SHA-256"
          done

      - name: Upload Free APK
        uses: actions/upload-artifact@v4
        with:
          name: MouthMIDI-Free-release
          path: app/build/outputs/apk/free/release/*.apk

      - name: Upload Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: MouthMIDI-Pro-release
          path: app/build/outputs/apk/pro/release/*.apk
